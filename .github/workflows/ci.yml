name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

jobs:
    pre-commit:
        name: pre-commit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - uses: pre-commit/action@v3.0.1

    bandit:
        name: Bandit security scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Install Bandit
              run: pip install bandit
            - name: Run Bandit (matches plugins.qgis.org security scan)
              run: bandit -r qgis_geemap

    pyqt-smoke:
        name: ${{ matrix.qt-binding }} import smoke (Py ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13"]
                qt-binding: [PyQt5, PyQt6]
                exclude:
                    # PyQt5 wheels are not published for Python 3.13.
                    - python-version: "3.13"
                      qt-binding: PyQt5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install Qt runtime libs
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
            - name: Install ${{ matrix.qt-binding }} and pytest
              run: |
                  python -m pip install --upgrade pip
                  pip install ${{ matrix.qt-binding }} pytest
            - name: Run import smoke tests (${{ matrix.qt-binding }})
              env:
                  QT_BINDING: ${{ matrix.qt-binding }}
              run: pytest tests -v
